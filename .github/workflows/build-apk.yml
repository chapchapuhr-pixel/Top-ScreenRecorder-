name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant to assemble'
        required: true
        default: 'all'
        type: choice
        options:
          - 'debug'
          - 'release'
          - 'all'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          # Ensure gradle-wrapper.jar exists (download official jar if missing or empty)
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Fetching official Gradle 8.11.1 wrapper jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar || true
          fi
          # Fallback to generating wrapper with Gradle CLI if needed
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Regenerating wrapper with Gradle CLI..."
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ] && [ -x "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Build Release APK & Bundle
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all' }}
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ] && [ -x "./gradlew" ]; then
            ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon
          else
            gradle assembleRelease bundleRelease --stacktrace --no-daemon
          fi

      - name: Collect & Organize Artifacts
        id: collect-artifacts
        run: |
          mkdir -p output-artifacts
          
          # 1. Debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$DEBUG_APK" ]; then
            DEBUG_APK=$(find . -path "*/build/outputs/apk/debug/*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" output-artifacts/FreeScreenRecorder-debug.apk
            echo "has_debug=true" >> $GITHUB_OUTPUT
          else
            echo "has_debug=false" >> $GITHUB_OUTPUT
          fi

          # 2. Release APK
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            RELEASE_APK=$(find . -path "*/build/outputs/apk/release/*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" output-artifacts/FreeScreenRecorder-release.apk
            echo "has_release=true" >> $GITHUB_OUTPUT
          else
            echo "has_release=false" >> $GITHUB_OUTPUT
          fi

          # 3. Release AAB (Google Play App Bundle)
          RELEASE_AAB=$(find app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1)
          if [ -z "$RELEASE_AAB" ]; then
            RELEASE_AAB=$(find . -path "*/build/outputs/bundle/release/*.aab" 2>/dev/null | head -n 1)
          fi
          if [ -n "$RELEASE_AAB" ] && [ -f "$RELEASE_AAB" ]; then
            cp "$RELEASE_AAB" output-artifacts/FreeScreenRecorder-release.aab
            echo "has_aab=true" >> $GITHUB_OUTPUT
          else
            echo "has_aab=false" >> $GITHUB_OUTPUT
          fi

          # 4. Professionally sign with upload key
          if [ -f "release-upload.jks.base64" ] && [ ! -f "release-upload.jks" ]; then
            base64 -d release-upload.jks.base64 > release-upload.jks
          fi
          if [ -f "release-upload.jks" ]; then
            if [ -f "output-artifacts/FreeScreenRecorder-release.aab" ]; then
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore release-upload.jks -storepass 52775277Tanzania -keypass 52775277Tanzania \
                output-artifacts/FreeScreenRecorder-release.aab upload
              jarsigner -verify -verbose -certs output-artifacts/FreeScreenRecorder-release.aab
            fi
            if [ -f "output-artifacts/FreeScreenRecorder-release.apk" ]; then
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore release-upload.jks -storepass 52775277Tanzania -keypass 52775277Tanzania \
                output-artifacts/FreeScreenRecorder-release.apk upload || true
            fi
          fi

          ls -lh output-artifacts/

      - name: Generate Build Checksums & Summary
        run: |
          echo "### 📱 Android Build Summary (ID: co.freescreenrecorder.ap)" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | SHA-256 Checksum | Target |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          
          cd output-artifacts
          for f in *; do
            if [ -f "$f" ]; then
              SIZE=$(ls -lh "$f" | awk '{print $5}')
              SHA=$(sha256sum "$f" | awk '{print $1}')
              TARGET="Direct Install"
              if [[ "$f" == *".aab" ]]; then
                TARGET="Google Play Store"
              fi
              echo "| **$f** | $SIZE | \`$SHA\` | $TARGET |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          cd ..

      - name: Upload Debug APK Artifact
        if: steps.collect-artifacts.outputs.has_debug == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FreeScreenRecorder-debug-apk
          path: output-artifacts/FreeScreenRecorder-debug.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        if: steps.collect-artifacts.outputs.has_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FreeScreenRecorder-release-apk
          path: output-artifacts/FreeScreenRecorder-release.apk
          retention-days: 30

      - name: Upload Play Store AAB Artifact
        if: steps.collect-artifacts.outputs.has_aab == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FreeScreenRecorder-release-aab
          path: output-artifacts/FreeScreenRecorder-release.aab
          retention-days: 60

      - name: Create GitHub Release (Tags Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output-artifacts/*.apk
            output-artifacts/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
